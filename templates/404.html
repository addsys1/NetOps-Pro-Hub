{% extends 'base.html' %}

{% block title %}404 — Page introuvable — NetOps Pro Hub{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="error-page py-5">
        <div class="error-code mb-3">404</div>
        <h1 class="h3 fw-bold mb-3">Page introuvable</h1>
        <p class="text-muted mb-4">
          La procédure ou la page que vous cherchez n'existe pas ou a été déplacée.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="/" class="btn btn-primary">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
          <a href="/procedures/" class="btn btn-outline-secondary">
            <i class="bi bi-collection me-2"></i>Catalogue
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.error-code {
  font-size: 7rem;
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
</style>
{% endblock %}
