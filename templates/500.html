{% extends 'base.html' %}

{% block title %}500 — Erreur serveur — NetOps Pro Hub{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="error-page py-5">
        <div class="error-code mb-3">500</div>
        <h1 class="h3 fw-bold mb-3">Erreur interne du serveur</h1>
        <p class="text-muted mb-4">
          Une erreur inattendue s'est produite. L'équipe technique a été notifiée.
        </p>
        <a href="/" class="btn btn-primary">
          <i class="bi bi-arrow-left me-2"></i>Retour au Dashboard
        </a>
      </div>
    </div>
  </div>
</div>

<style>
.error-code {
  font-size: 7rem;
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, #ef4444, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
</style>
{% endblock %}
