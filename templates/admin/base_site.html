{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | NetOps Pro Hub Admin{% endblock %}

{% block branding %}
<div id="site-name" style="display:flex; align-items:center; gap:10px;">
  <span style="
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; color:white; flex-shrink:0;">
    &#x1F5A7;
  </span>
  <div>
    <a href="{% url 'admin:index' %}" style="color:white; text-decoration:none; font-weight:700; font-size:1rem; display:block; line-height:1.2;">
      NetOps Pro Hub
    </a>
    <span style="color:rgba(255,255,255,0.55); font-size:0.65rem; text-transform:uppercase; letter-spacing:.08em;">
      Administration
    </span>
  </div>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  #header { background: linear-gradient(135deg, #0f1b2d 0%, #1e3250 100%) !important; padding: 10px 20px; }
  #user-tools { font-size: 0.8rem; }
  .breadcrumbs { background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
  #content-main { font-family: 'Inter', system-ui, sans-serif; }
  .module h2, .module caption { background: linear-gradient(135deg, #0f1b2d, #1e3250); }
  a:link, a:visited { color: #3b82f6; }
  .button, input[type=submit], input[type=button] { background: #3b82f6; border: none; }
  .button:hover, input[type=submit]:hover { background: #2563eb; }
</style>
{% endblock %}
